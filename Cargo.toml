[package]
name = "useless-buttons-core"
version = "0.1.0"
edition = "2021"
description = "Deterministic, pixel-buffer simulations (boids, sand, life, mandelbrot) for the useless-buttons Web Components package"
license = "MIT"
repository = "https://github.com/example/useless-buttons"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
gif = "0.13"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[[example]]
name = "preview"
path = "examples/preview.rs"
